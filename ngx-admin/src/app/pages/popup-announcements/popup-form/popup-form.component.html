<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header>
    {{ id ? 'PopUp Duyuru Düzenle' : 'Yeni PopUp Duyuru Ekle' }}
  </nb-card-header>

  <nb-card-body>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group row">
        <label for="title" class="label col-sm-3 col-form-label">Başlık</label>
        <div class="col-sm-9">
          <input type="text" nbInput fullWidth id="title" formControlName="title" placeholder="Duyuru Başlığı"
            [status]="form.get('title')?.invalid && form.get('title')?.touched ? 'danger' : 'basic'">
        </div>
      </div>

      <div class="form-group row">
        <label class="label col-sm-3 col-form-label">PopUp Görseli</label>
        <div class="col-sm-9">
          <div class="d-flex flex-column align-items-start">
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
            <button type="button" nbButton status="primary" size="small" [nbSpinner]="uploading"
              (click)="fileInput.click()" *ngIf="!showCropper">
              Görsel Seç
            </button>
            <small class="text-muted mt-2 d-block" *ngIf="!showCropper">
              Önerilen ve Kesim Boyutu: 600x800 px (Dikey - 3:4 Oranı)
            </small>

            <div *ngIf="showCropper" class="mt-3 w-100 border p-3 rounded" style="background: #f8f9fa;">
              <h6 class="mb-3">Görseli Kırp</h6>
              <image-cropper
                [imageChangedEvent]="imageChangedEvent"
                [maintainAspectRatio]="true"
                [aspectRatio]="3 / 4"
                format="png"
                (imageCropped)="imageCropped($event)"
                (imageLoaded)="imageLoaded()"
                (cropperReady)="cropperReady()"
                (loadImageFailed)="loadImageFailed()"
                style="max-height: 400px; display: block;"
              ></image-cropper>
              <div class="mt-3">
                <button type="button" nbButton status="success" size="small" (click)="uploadCroppedImage()" class="mr-2" [disabled]="!croppedImage || uploading">
                  Kırp ve Yükle
                </button>
                <button type="button" nbButton status="basic" size="small" (click)="cancelCrop()">
                  İptal
                </button>
              </div>
            </div>

            <div *ngIf="!showCropper && (previewUrl || form.get('image_url')?.value)" class="mt-3 position-relative">
              <img [src]="previewUrl || form.get('image_url')?.value" alt="Preview" class="img-preview" style="max-height: 400px; max-width: 300px; object-fit: contain;">
              <button type="button" nbButton status="danger" size="tiny" class="remove-btn position-absolute" style="top: -10px; right: -10px;"
                (click)="form.patchValue({image_url: ''}); previewUrl = null">
                <nb-icon icon="trash-2-outline"></nb-icon>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group row">
        <label class="label col-sm-3 col-form-label">Durum</label>
        <div class="col-sm-9 d-flex align-items-center">
          <nb-toggle formControlName="is_active"></nb-toggle>
          <span class="ml-2" [class.text-success]="form.get('is_active')?.value"
            [class.text-danger]="!form.get('is_active')?.value">
            {{ form.get('is_active')?.value ? 'Aktif' : 'Pasif' }}
          </span>
          <small class="text-muted ml-3">(Sadece bir duyuru aynı anda aktif olabilir.)</small>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-sm-9 offset-sm-3">
          <button type="button" nbButton status="basic" class="mr-2" (click)="cancel()">İptal</button>
          <button type="submit" nbButton status="success" [disabled]="uploading || loading">
            Kaydet
          </button>
        </div>
      </div>
    </form>
  </nb-card-body>
</nb-card>
