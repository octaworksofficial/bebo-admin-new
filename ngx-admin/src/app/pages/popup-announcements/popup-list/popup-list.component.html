<nb-card [nbSpinner]="loading" nbSpinnerStatus="primary">
  <nb-card-header class="d-flex justify-content-between align-items-center">
    <span>PopUp Duyuru Listesi</span>
    <button nbButton status="primary" size="small" routerLink="/pages/popup-announcements/create">
      <nb-icon icon="plus-outline"></nb-icon> Yeni Ekle
    </button>
  </nb-card-header>

  <nb-card-body>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Görsel</th>
            <th>Başlık</th>
            <th>Durum</th>
            <th>Tarih</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let popup of popups">
            <td>
              <img [src]="popup.image_url" alt="popup" style="width: 80px; height: auto; border-radius: 4px;" />
            </td>
            <td class="align-middle">{{ popup.title }}</td>
            <td class="align-middle">
              <nb-toggle [checked]="popup.is_active" (checkedChange)="toggleActive(popup)"></nb-toggle>
              <span class="ml-2" [class.text-success]="popup.is_active" [class.text-danger]="!popup.is_active">
                {{ popup.is_active ? 'Aktif' : 'Pasif' }}
              </span>
            </td>
            <td class="align-middle">{{ popup.created_at | date:'short' }}</td>
            <td class="align-middle">
              <button nbButton ghost status="info" size="small" (click)="editPopup(popup.id!)">
                <nb-icon icon="edit-2-outline"></nb-icon>
              </button>
              <button nbButton ghost status="danger" size="small" (click)="deletePopup(popup.id!)">
                <nb-icon icon="trash-2-outline"></nb-icon>
              </button>
            </td>
          </tr>
          <tr *ngIf="popups.length === 0 && !loading">
            <td colspan="5" class="text-center py-4">Kayıtlı duyuru bulunamadı.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </nb-card-body>
</nb-card>
